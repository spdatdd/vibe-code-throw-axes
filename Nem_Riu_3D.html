<script>
// ================= HẰNG SỐ (dễ chỉnh) =================
const GRAV=9.8,DRAG=0.05,MAX_PULL=150,AXES=5,STICK_COS=-0.15,HL=0.53,TR_R=1.2,
RINGS=[[0.17,100],[0.45,50],[0.78,25],[1.2,10]],BULL_R=0.09,BULL_BONUS=50,CAM_Y=1.6;
const $=id=>document.getElementById(id),ov=$('ov');
// ================= ÂM THANH =================
let ac,nb;
function initAudio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();nb=ac.createBuffer(1,ac.sampleRate*.4,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
function tone(ty,f1,f2,dur,v){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(n).connect(ac.destination);o.start(t);o.stop(t+dur)}
function noise(dur,f1,f2,v){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=nb;f.type='bandpass';f.frequency.setValueAtTime(f1,t);f.frequency.exponentialRampToValueAtTime(f2,t+dur);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f).connect(n).connect(ac.destination);s.start(t);s.stop(t+dur)}
const SFX={whoosh:()=>noise(.35,500,2000,.5),stick:()=>{tone('sine',160,50,.18,.9);noise(.1,1200,300,.4)},bounce:()=>{tone('square',900,500,.12,.15);noise(.05,3000,2000,.2)},thud:()=>tone('sine',90,40,.15,.5),bull:()=>[660,880,1320].forEach((f,i)=>setTimeout(()=>tone('triangle',f,f*1.01,.2,.3),i*90))};
// ================= CẢNH 3D =================
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});R.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(R.domElement);
const scene=new THREE.Scene(),SKY=0xffc88a;scene.background=new THREE.Color(SKY);scene.fog=new THREE.Fog(SKY,25,110);
const cam=new THREE.PerspectiveCamera(60,1,.1,200);cam.position.set(0,CAM_Y,0);scene.add(cam);
const hemi=new THREE.HemisphereLight(0xfff0d0,0x6a4a2a,.9);scene.add(hemi);const sun=new THREE.DirectionalLight(0xffe0b0,.8);sun.position.set(-5,10,6);scene.add(sun);
const M=(c,em=0)=>new THREE.MeshLambertMaterial({color:c,emissive:em,flatShading:true});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),M(0x6a8a35));ground.rotation.x=-Math.PI/2;scene.add(ground);
const lane=new THREE.Mesh(new THREE.PlaneGeometry(5,120),M(0x8a6a3a));lane.rotation.x=-Math.PI/2;lane.position.set(0,.01,-45);scene.add(lane);
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(7,16,16),new THREE.MeshBasicMaterial({color:0xfff3c4,fog:false}));scene.add(sunBall);
const moonBall=new THREE.Mesh(new THREE.SphereGeometry(5,16,16),new THREE.MeshBasicMaterial({color:0xe6efff,fog:false}));scene.add(moonBall);
// bầu trời sao (~350 ngôi sao hiện dần vào ban đêm)
const starMat=new THREE.PointsMaterial({color:0xffffff,size:1.1,transparent:true,opacity:0,fog:false});
{const sp=[];for(let i=0;i<350;i++){const th=Math.random()*Math.PI*2,ph=Math.random()*Math.PI*.42+.05,r=145;
sp.push(r*Math.cos(ph)*Math.cos(th),r*Math.sin(ph)+8,r*Math.cos(ph)*Math.sin(th))}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));scene.add(new THREE.Points(sg,starMat))}
// 2 đống lửa trại (bonfire) hai bên bia để thắp sáng đích
const bonfires=[];
{const stoneM=M(0x5a5e5a),logM=M(0x4a2c16),f1M=new THREE.MeshBasicMaterial({color:0xff6a1a,transparent:true,opacity:.8,fog:false}),f2M=new THREE.MeshBasicMaterial({color:0xffdf55,fog:false});
const stG=new THREE.DodecahedronGeometry(.14,0),lgG=new THREE.CylinderGeometry(.06,.07,.72,6),flG=new THREE.ConeGeometry(.24,.75,6);
for(const side of[-1,1]){
  const bf=new THREE.Group();
  for(let i=0;i<8;i++){const a=i*Math.PI/4,st=new THREE.Mesh(stG,stoneM);st.position.set(Math.cos(a)*.38,.08,Math.sin(a)*.38);bf.add(st)}
  for(let i=0;i<4;i++){const lg=new THREE.Mesh(lgG,logM);lg.position.y=.12;lg.rotation.set(Math.PI/2-.22,i*Math.PI/2,0);bf.add(lg)}
  const f1=new THREE.Mesh(flG,f1M);f1.position.y=.42;
  const f2=new THREE.Mesh(flG,f2M);f2.position.y=.38;f2.scale.set(.62,.82,.62);
  const lt=new THREE.PointLight(0xff8c32,0,15);lt.position.set(0,1.1,0);
  bf.add(f1,f2,lt);bf.position.set(side*3.25,0,-14.4);scene.add(bf);
  bonfires.push({g:bf,f1,f2,lt,side,ph:side>0?1.7:0});
}}
const clouds=[],cloudMat=new THREE.MeshBasicMaterial({color:0xffffff,fog:false});
{const cg=new THREE.SphereGeometry(1,8,6);for(let i=0;i<14;i++){const g=new THREE.Group();
for(let j=0;j<3;j++){const p=new THREE.Mesh(cg,cloudMat);p.position.set((j-1)*2.4,(j===1?.5:0),0);p.scale.set(2.4,1.1,1.5);g.add(p)}
g.position.set((Math.random()-.5)*170,28+Math.random()*14,-35-Math.random()*85);g.scale.setScalar(.9+Math.random()*1.1);scene.add(g);clouds.push({g,sp:1.2+Math.random()*1.4})}}

// ================= TẢI MODEL GLB TỪ ASSETS =================
const ASSETS={};
const AXE_TYPES=[
  {key:'axe',label:'🪓 Rìu Viking',gripScale:.48,tipZ:.72,tipY:.04},
  {key:'axe_double',label:'⚔️ Rìu 2 Lưỡi',gripScale:.46,tipZ:.56,tipY:-.35},
  {key:'axe_tomahawk',label:'🪶 Tomahawk',gripScale:.50,tipZ:.68,tipY:-.08}
];
let axeIdx=0;
function colorByPart(obj,fn,emissive=0){
  const mat=new THREE.MeshLambertMaterial({vertexColors:true,flatShading:true,emissive});
  const box=new THREE.Box3().setFromObject(obj),sz=new THREE.Vector3(),mn=box.min;box.getSize(sz);
  const c=new THREE.Color(),v0=new THREE.Vector3(),v1=new THREE.Vector3(),v2=new THREE.Vector3(),vc=new THREE.Vector3(),nm=new THREE.Vector3();
  obj.traverse(n=>{if(!n.isMesh||!n.geometry)return;
    const g=n.geometry.index?n.geometry.toNonIndexed():n.geometry.clone();
    g.computeVertexNormals();
    const pos=g.attributes.position,nor=g.attributes.normal,col=new Float32Array(pos.count*3);
    for(let i=0;i<pos.count;i+=3){
      v0.fromBufferAttribute(pos,i).applyMatrix4(n.matrixWorld);
      v1.fromBufferAttribute(pos,i+1).applyMatrix4(n.matrixWorld);
      v2.fromBufferAttribute(pos,i+2).applyMatrix4(n.matrixWorld);
      vc.copy(v0).add(v1).add(v2).multiplyScalar(1/3);
      nm.fromBufferAttribute(nor,i);
      const nx=(vc.x-mn.x)/Math.max(sz.x,.001),ny=(vc.y-mn.y)/Math.max(sz.y,.001),nz=(vc.z-mn.z)/Math.max(sz.z,.001);
      c.setHex(fn(vc,nm,nx,ny,nz));
      for(let k=0;k<3;k++){col[(i+k)*3]=c.r;col[(i+k)*3+1]=c.g;col[(i+k)*3+2]=c.b}
    }
    g.setAttribute('color',new THREE.BufferAttribute(col,3));
    n.geometry=g;n.material=mat;
  });
  return obj;
}
function normModel(raw,targetSize,rot={x:0,y:0,z:0},bottomZero=false){
  const w=new THREE.Group(),inner=raw.clone();
  inner.rotation.set(rot.x,rot.y,rot.z);
  inner.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(inner);
  const sz=new THREE.Vector3(),ct=new THREE.Vector3();
  box.getSize(sz);box.getCenter(ct);
  const sc=targetSize/Math.max(sz.x,sz.y,sz.z,.001);
  inner.scale.setScalar(sc);
  inner.position.set(-ct.x*sc,bottomZero?-box.min.y*sc:-ct.y*sc,-ct.z*sc);
  w.add(inner);return w;
}
function loadGLBs(){
  const loader=new THREE.GLTFLoader();
  const files={
    axe:'assets/axe.glb',
    axe_double:'assets/axe_double.glb',
    axe_tomahawk:'assets/axe_tomahawk.glb',
    target:'assets/target.glb',
    target_stump:'assets/target_stump.glb',
    target_stand:'assets/target_stand.glb',
    pine_tree_1:'assets/pine_tree_1.glb',
    pine_tree_2:'assets/pine_tree_2.glb',
    fence_rock:'assets/fence_rock.glb'
  };
  return Promise.all(Object.entries(files).map(([k,url])=>new Promise((res,rej)=>{
    loader.load(url,g=>{ASSETS[k]=g.scene;res()},undefined,rej);
  })));
}
function makeAxe(typeKey=AXE_TYPES[axeIdx].key){
  const g=new THREE.Group();
  const raw=ASSETS[typeKey]||ASSETS.axe;
  const rot=typeKey==='axe'?{x:0,y:-Math.PI/2,z:0}:typeKey==='axe_double'?{x:-Math.PI/2,y:Math.PI/2,z:0}:{x:-Math.PI/2,y:-Math.PI/2,z:0};
  const m=normModel(raw,0.92,rot,false);
  m.updateMatrixWorld(true);
  colorByPart(m,(v,nm,nx,ny,nz)=>{
    if(typeKey==='axe_double')return Math.abs(v.y)>.055&&v.z<-.04?(Math.abs(v.y)>.24?0xdde6ee:0x96a3b0):v.z<-.34?0x8a96a3:0x6d4222;
    if(typeKey==='axe_tomahawk')return v.z<-.18&&v.y<-.03?(v.y<-.10?0xdde6ee:0x99a6b3):v.z>.18?0x4d2e18:0x8a582e;
    return v.z<-.16&&Math.abs(v.y)>.04?(v.y>.12?0xe2ebf2:0x9aa7b4):v.z>.2?0x4d2e18:0x8c592e;
  },0x101418);
  m.position.z=-.3;
  g.add(m);return g;
}

// bia: nhóm T (vị trí) > TR (xoay quanh trục Z) + giá đỡ target_stand
const T=new THREE.Group(),TR=new THREE.Group();scene.add(T);T.add(TR);
const standGrp=new THREE.Group();scene.add(standGrp);
let targetMeshes=[],targetFrontZ=.06;
const targetTex=(()=>{
  const cv=document.createElement('canvas');cv.width=cv.height=512;const ctx=cv.getContext('2d'),cx=256,Rpx=256;
  ctx.fillStyle='#593418';ctx.fillRect(0,0,512,512);
  [[1.15,'#9c6230'],[.78,'#e6c796'],[.45,'#d9442b'],[.17,'#ffd23f'],[.09,'#ffe885']].forEach(([r,c])=>{
    ctx.beginPath();ctx.arc(cx,cx,r/TR_R*Rpx,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();
  });
  const t=new THREE.CanvasTexture(cv);t.anisotropy=4;return t;
})();
function setTargetModel(lvlNum){
  for(const m of targetMeshes)TR.remove(m);
  targetMeshes=[];
  const useStump=lvlNum%2===0;
  targetFrontZ=useStump?.15:.06;
  const raw=useStump?ASSETS.target_stump:ASSETS.target;
  const board=normModel(raw,TR_R*2,{x:0,y:0,z:0},false);
  board.updateMatrixWorld(true);
  const frontMat=new THREE.MeshLambertMaterial({map:targetTex,flatShading:true});
  const backMat=M(useStump?0x4a2c14:0x593418);
  board.traverse(n=>{if(!n.isMesh||!n.geometry)return;
    const g=n.geometry.index?n.geometry.toNonIndexed():n.geometry.clone();
    g.computeVertexNormals();
    const pos=g.attributes.position,nor=g.attributes.normal,uv=new Float32Array(pos.count*2),v0=new THREE.Vector3(),v1=new THREE.Vector3(),v2=new THREE.Vector3(),vc=new THREE.Vector3(),nm=new THREE.Vector3();
    const maxR=useStump?1.02:1.12;
    for(let i=0;i<pos.count;i+=3){
      v0.fromBufferAttribute(pos,i).applyMatrix4(n.matrixWorld);
      v1.fromBufferAttribute(pos,i+1).applyMatrix4(n.matrixWorld);
      v2.fromBufferAttribute(pos,i+2).applyMatrix4(n.matrixWorld);
      vc.copy(v0).add(v1).add(v2).multiplyScalar(1/3);
      nm.fromBufferAttribute(nor,i);
      const ok=nm.z>.55&&vc.z>0&&Math.hypot(vc.x,vc.y)<=maxR;
      const vs=[v0,v1,v2];
      for(let k=0;k<3;k++){
        uv[(i+k)*2]=ok?vs[k].x/(TR_R*2)+.5:.02;
        uv[(i+k)*2+1]=ok?vs[k].y/(TR_R*2)+.5:.02;
      }
    }
    g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    n.geometry=g;n.material=frontMat;
  });
  board.position.z=-.08;
  TR.add(board);targetMeshes.push(board);
}
const trees=[];
function buildEnvironment(){
  // giá đỡ bia từ target_stand.glb
  const st=normModel(ASSETS.target_stand,2.4,{x:0,y:0,z:0},true);
  st.updateMatrixWorld(true);
  colorByPart(st,(v,nm,nx,ny)=>ny<.15?0x3f2612:0x5e3b1d);
  standGrp.add(st);
  // cụm đá rêu + rừng thông đặt tách nhau để không chồng lấn
  let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647,rocks=[];
  for(let i=0;i<26;i++){
    const x=(rnd()<.5?-1:1)*(3.6+rnd()*6),z=-rnd()*88+2,k=1.1+rnd()*.9;
    const prop=normModel(ASSETS.fence_rock,k,{x:0,y:rnd()*Math.PI*2,z:0},true);
    prop.updateMatrixWorld(true);
    colorByPart(prop,(v,nm,nx,ny)=>ny>.55&&nm.y>.45?0x587a42:nx<.35&&ny>.45?0x6e4726:0x737874);
    prop.position.set(x,0,z);scene.add(prop);rocks.push({x,z});
  }
  for(let i=0;i<75;i++){
    let x=(rnd()<.5?-1:1)*(6.2+rnd()*40),z=-rnd()*95+5;
    if(rocks.some(r=>Math.hypot(r.x-x,r.z-z)<3.0))x+=(x>0?3.5:-3.5);
    const k=3.6+rnd()*4.2,isTree1=rnd()<.55;
    const tree=normModel(isTree1?ASSETS.pine_tree_1:ASSETS.pine_tree_2,k,{x:0,y:rnd()*Math.PI*2,z:0},true);
    tree.updateMatrixWorld(true);
    colorByPart(tree,(v,nm,nx,ny)=>{
      const r=Math.hypot(v.x,v.z);
      if(ny<.26&&r<.14*k)return 0x5c381e;
      return ny>.72?0x4f8d44:isTree1?0x3b6e32:0x2e5b2a;
    });
    tree.position.set(x,0,z);scene.add(tree);
    trees.push({m:tree,ph:rnd()*Math.PI*2,sp:.9+rnd()*.6});
  }
}

// chỉ hiển thị cây rìu trên camera với animation ném 3 giây
let wp=-1,wy=0,thr=null,fdt=.016,trPts=[];
const axePivot=new THREE.Group();
let ready=new THREE.Group();
function buildHandModels(){

  axePivot.rotation.set(1.05,-.15,0);

function refreshReadyAxe(){

const trail=new THREE.Line(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.5,fog:false}));trail.frustumCulled=false;scene.add(trail);
const dots=[];for(let i=0;i<40;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.05,6,6),new THREE.MeshBasicMaterial({color:0xffffff,fog:false}));d.visible=false;scene.add(d);dots.push(d)}
// ================= TRẠNG THÁI =================
let best=0;try{best=+localStorage.getItem('axeBest3d')||0}catch(e){}

    const u=Math.min(1,(t-1.85)/1.15),e=u*u*(3-2*u);
    px=.15;py=-.38+.16*e;pz=-.70+.18*e;rx=.25+.80*e;camDip=-.098*(1-e);
  }
  const s=Math.min(1,fdt*20);
  axePivot.position.x+=(px-axePivot.position.x)*s;
  axePivot.position.y+=(py-axePivot.position.y)*s;
  axePivot.position.z+=(pz-axePivot.position.z)*s;
  axePivot.rotation.set(rx,ry,0);
}else{
  camDip+=(0-camDip)*k;
  let px=.24,py=-.22+Math.sin(time*2)*.008,pz=-.52,rx=1.05,ry=-.15;
  if(wp>=0){px=.24+.12*wp;py=-.22+.16*wp;pz=-.52+.18*wp;rx=1.05+.55*wp;ry=-.15-wy*.35}
  axePivot.position.x+=(px-axePivot.position.x)*k;
  axePivot.position.y+=(py-axePivot.position.y)*k;
  axePivot.position.z+=(pz-axePivot.position.z)*k;
  axePivot.rotation.set(rx,ry,0);
}}
function render(){if(photoMode){
  const spd=8*fdt,fwd=new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(pmCam.pit,pmCam.yaw,0,'YXZ')),
  rgt=new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0,pmCam.yaw,0,'YXZ'));
  if(keys['w']||keys['arrowup'])pmCam.pos.addScaledVector(fwd,spd);
  if(keys['s']||keys['arrowdown'])pmCam.pos.addScaledVector(fwd,-spd);
  if(keys['a']||keys['arrowleft'])pmCam.pos.addScaledVector(rgt,-spd);
  if(keys['d']||keys['arrowright'])pmCam.pos.addScaledVector(rgt,spd);
  if(keys['e'])pmCam.pos.y+=spd;
  if(keys['q'])pmCam.pos.y-=spd;
  pmCam.pos.y=Math.max(.55,pmCam.pos.y);
  cam.position.copy(pmCam.pos);cam.rotation.set(pmCam.pit,pmCam.yaw,0,'YXZ');
  axePivot.visible=false;pow.style.display=elv.style.display='none';dots.forEach(d=>d.visible=false);
  R.render(scene,cam);return;
}
axePivot.visible=true;
let on=false;wp=-1;ready.visible=canAim()||(!!thr&&(!thr.launched||(thr.t>=2.1&&!cur&&axesLeft>0)));
cam.rotation.set((thr?thr.cp:0)+camDip,thr?thr.cy:0,0,'YXZ');
if(aim){on=true;const a=aimVec(aim.dx,aim.dy,aim.hold);cam.rotation.set(0,-a.yaw*.5,0,'YXZ');
const spRef=20,p=ORIGIN.clone(),v=new THREE.Vector3(spRef*Math.cos(a.pit)*Math.sin(a.yaw),spRef*Math.sin(a.pit),-spRef*Math.cos(a.pit)*Math.cos(a.yaw));let alive=true;
dots.forEach((d,i)=>{if(alive)for(let k=0;k<2;k++){v.y-=GRAV*.03;v.multiplyScalar(1-DRAG*.03);p.addScaledVector(v,.03)}
if(p.y<0||p.z<tg.z-1)alive=false;d.visible=alive;d.position.copy(p);d.scale.setScalar(1-i*.015)});
pi.style.height=a.p*100+'%';pi.style.background=a.p<.6?'#8fd14f':a.p<.85?'#ffd23f':'#e8452b';
ei.style.height=a.el*100+'%';
wp=a.p;wy=a.yaw}
else dots.forEach(d=>d.visible=false);
pow.style.display=elv.style.display=on?'block':'none';
if(repIdx>=0&&lastRec){
  const f=lastRec.frames[repIdx];
  cam.position.copy(f.cp);cam.lookAt(f.cl);axePivot.visible=false;
}else if(followCam&&(cur||settle>0)){
  const k=1-Math.exp(-fdt*10);
  if(cur){
    const tip=tipOf(cur),dir=cur.v.lengthSq()>.01?cur.v.clone().normalize():new THREE.Vector3(0,0,-1);
    const dst=tip.clone().addScaledVector(dir,-1.45).add(new THREE.Vector3(.38,.36,0));
    dst.y=Math.max(.45,dst.y);
    followPos.lerp(dst,k);followLook.lerp(tip,Math.min(1,fdt*18));
  }
  cam.position.set(followPos.x+(Math.random()-.5)*shake*.08,followPos.y+(Math.random()-.5)*shake*.08,followPos.z);
  cam.lookAt(followLook);
  axePivot.visible=false;
}else{
  cam.position.set((Math.random()-.5)*shake*.1,CAM_Y+(Math.random()-.5)*shake*.1,0);
  animHand();
}
R.render(scene,cam)}
const SKY_DAY=new THREE.Color(0x88c9ff),SKY_SUNSET=new THREE.Color(0xff9b66),SKY_NIGHT=new THREE.Color(0x0c1428),_skyC=new THREE.Color();
let skyT=0;
function updateAtmosphere(dt){
  skyT+=dt;
  const mode=TIME_MODES[tmIdx].k,ang=mode==='day'?Math.PI/2:mode==='night'?-Math.PI/2:skyT*.045+.55,sy=Math.sin(ang)+(mode==='auto'?.28:0),cx=Math.cos(ang);
  sunBall.position.set(-45*cx,55*sy,-110);
  moonBall.position.set(45*cx,-55*sy,-110);
  sunBall.visible=sy>-.15;moonBall.visible=sy<.15;
  if(sy>=.15){_skyC.copy(SKY_SUNSET).lerp(SKY_DAY,Math.min(1,(sy-.15)/.45))}
  else if(sy>-.15){_skyC.copy(SKY_NIGHT).lerp(SKY_SUNSET,(sy+.15)/.3)}
  else{_skyC.copy(SKY_NIGHT)}
  scene.background.copy(_skyC);scene.fog.color.copy(_skyC);
  const dayF=Math.max(0,Math.min(1,(sy+.15)/.5));
  hemi.intensity=.35+.65*dayF;sun.intensity=.15+.75*dayF;
  sun.position.set(-12*cx,Math.max(4,18*sy),8);
  starMat.opacity=Math.max(0,Math.min(1,(-.05-sy)/.35));
  cloudMat.color.copy(_skyC).lerp(new THREE.Color(0xffffff),.55+.35*dayF);
  for(const cl of clouds){cl.g.position.x+=cl.sp*dt;if(cl.g.position.x>90)cl.g.position.x=-90}
  for(const tr of trees){tr.m.rotation.z=Math.sin(skyT*1.3*tr.sp+tr.ph)*.032;tr.m.rotation.x=Math.cos(skyT*1.0*tr.sp+tr.ph)*.015}
  const nightF=Math.max(0,Math.min(1,(-.05-sy)/.25));
  for(const bf of bonfires){
    bf.g.position.z=tg.z+.6;
    const fl=.85+Math.sin(skyT*15+bf.ph)*.18+Math.cos(skyT*23+bf.ph)*.12;
    const lit=nightF>.02;bf.f1.visible=bf.f2.visible=lit;
    if(lit){bf.f1.scale.set(1,fl*nightF,1);bf.f2.scale.set(.62,.75*fl*nightF,.62)}
    bf.lt.intensity=lit?1.4*nightF*fl:0;
  }
}
let last=performance.now();function loop(t){const dt=Math.min((t-last)/1000||0,.033);last=t;fdt=dt;updateAtmosphere(dt);if(!photoMode&&(state==='play'||state==='next'||state==='over'))update(dt);if(repPlay&&lastRec&&repIdx>=0){repT+=dt*REP_SPDS[repSpdIdx]*(followCam?.42:1);const fs=lastRec.frames;let nxt=repIdx;while(nxt<fs.length-1&&fs[nxt+1].t<=repT)nxt++;if(nxt!==repIdx)applyReplay(nxt);if(repIdx>=fs.length-1){if(photoMode){applyReplay(0);repT=0}else{repPlay=false;$('repPlay').textContent='▶'}}}render();requestAnimationFrame(loop)}
T.position.set(0,1.9,tg.z);
show('NÉM RÌU 3D','Đang tải các mô hình 3D...','',()=>{});
loadGLBs().then(()=>{buildEnvironment();buildHandModels();setTargetModel(1);showMenu();requestAnimationFrame(loop)}).catch(err=>{
show('Lỗi tải mô hình','Không tải được file .glb trong thư mục assets/.\nHãy mở game qua local server (vd: python -m http.server hoặc npx serve) thay vì mở trực tiếp file://.','Thử lại',()=>location.reload());
console.error(err);
});
