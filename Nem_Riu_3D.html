<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ném Rìu 3D</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="hud" class="t"></div>
  <div id="combo" class="t"></div>
  <div id="hint" class="t"></div>
  <div id="pow" title="Lực"><i></i></div>
  <div id="elv" title="Độ cao"><i></i></div>
  <button id="pb">⏸</button>
  <button id="ab">⚔️ Rìu 2 Lưỡi</button>
  <button id="pm">📷 Photo</button>
  <button id="tm">☀️ Ngày</button>
  <button id="fc">🎥 Theo rìu: Bật</button>
  <button id="rp">🔁 Xem lại</button>
  <button id="at">🤖 Tự ném: Tắt</button>
  <div id="pmBar">
    <span>Kéo chuột: xoay · WASD / Mũi tên: di chuyển · Q/E: lên/xuống · Cuộn: zoom</span>
    <button id="snap">📸 Chụp</button>
  </div>
  <div id="repBar">
    <button id="repPlay">▶</button>
    <button id="repSpd">1x</button>
    <input id="repScrub" type="range" min="0" max="0" value="0">
    <span id="repTime">0.0s</span>
    <button id="repSave">🎬 Lưu</button>
    <button id="repClose">✖</button>
  </div>
  <div id="ov"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
